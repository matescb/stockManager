# Production compose for the parts-inventory app.
#
# Usage:
#   cp deploy/.env.prod.example .env.prod
#   # edit .env.prod (rotate SESSION_SECRET, set CORS_ORIGINS, set strong POSTGRES_PASSWORD)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Architecture (matches the rest of this VPS — see docs/deployment.md):
#   - Public TLS termination + vhost routing happens in the host's Apache 2.4.
#   - This compose stack binds ONE host port (web on 127.0.0.1:8091); Apache
#     ProxyPass'es parts.matescb.cz to it.
#   - The web container's nginx handles the SPA-vs-API split: /api/* is proxied
#     to the backend container over the docker network; everything else is the
#     static Vite bundle.
#   - backend and db never publish a host port — only the docker network.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 2g
    pids_limit: 512
    oom_kill_disable: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]

  # One-shot init container: fixes /data ownership as root before backend
  # starts. This replaces the old gosu trampoline that ran chown inside the
  # backend container itself (requiring the runtime process to start as root).
  # restart: no ensures it never loops; backend depends_on with
  # service_completed_successfully gates startup on a clean exit.
  backend-init:
    build: ./backend
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - uploads:/data/uploads
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.5"
    pids_limit: 512
    oom_kill_disable: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      # INFRA2-005: pass discrete parts instead of the assembled URL so
      # the password is not interpolated into DATABASE_URL and thus does
      # not appear verbatim in `docker inspect` output.  Settings assembles
      # the final URL at runtime (see backend/app/core/config.py).
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOAD_DIR: /data/uploads
      APP_ENV: prod
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Fernet key for encrypting workspace-level secrets at rest
      # (provider API keys, scanner license keys). The backend's
      # Settings validator rejects an empty value when APP_ENV=prod, so
      # leaving this unset in .env.prod fails the deploy fast (loud
      # ValidationError on import) instead of silently encrypting under
      # a fallback key. Generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      WORKSPACE_SECRETS_KEY: ${WORKSPACE_SECRETS_KEY}
      # Empty in unset / dev — SDK becomes a no-op.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      # Release identifier — populated by the deploy script with the
      # current git SHA so Sentry groups issues per release.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Frontend DSN, read by the backend solely so /api/sentry-tunnel
      # can allow-list its forwarder against the React project. Vite
      # also bakes this into the SPA bundle at build time (see web
      # service below).
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      # Email / SMTP for the email-verification flow (issue #281).
      # No `:-` defaults on the required values (HOST/USER/PASSWORD/MAIL_FROM/
      # APP_BASE_URL) — a missing entry in .env.prod becomes a Compose
      # "variable is not set" warning, AND the backend's
      # `_require_smtp_in_prod` validator hard-fails at import. Both are
      # intentional: the silent-fallback failure mode (verification link
      # written to container logs) is exactly what this issue removed.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    # INFRA2-002 / INFRA-001: a healthy container in compose's eyes means
    # "/api/health returns 200." Failures during start_period don't count
    # against retries — alembic upgrade + DB connect on first boot can
    # take >10s, so we give it 60s before any miss is fatal. `web` waits
    # on this via depends_on.condition below, eliminating the post-deploy
    # 502 window where nginx came up before the backend.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    # --proxy-headers + --forwarded-allow-ips='*' make uvicorn rewrite
    # request.client.host from the X-Forwarded-For header that Apache
    # populates. Without it, every request looks like it came from the
    # docker bridge IP and the auth rate-limiter buckets all clients
    # together. '*' is safe here because Apache strips/sets XFF and is
    # the only thing reachable on the docker network.
    #
    # --workers 1: slowapi's in-memory bucket store is per-process, so
    # the effective auth rate-limit gets multiplied by the worker count.
    # We're nowhere near needing parallelism at our scale; if traffic
    # ever justifies > 1 worker, switch slowapi to a Redis backend
    # before bumping this number.
    # Single-line so YAML's folded-scalar rules don't break shell tokens
    # across argv boundaries (uvicorn was missing --proxy-headers
    # because the YAML kept the newline before it intact).
    #
    # Runs as appuser (UID 1000) — USER is set in the Dockerfile. The
    # chown of /data is handled by the backend-init service above.
    # stop_grace_period: give Compose 30s before SIGKILL, matching
    # --timeout-graceful-shutdown 25 below (5s headroom so SIGKILL
    # never fires on a clean drain — see CLAUDE.md "Things that have bitten us").
    stop_grace_period: 30s
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips=* --timeout-graceful-shutdown 25"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  backend-cron:
    build: ./backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 256
    oom_kill_disable: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      # Same runtime config shape as backend. Keep POSTGRES_* discrete so
      # DATABASE_URL is assembled inside Settings without leaking the password
      # through docker inspect interpolation.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOAD_DIR: /data/uploads
      APP_ENV: prod
      CORS_ORIGINS: ${CORS_ORIGINS}
      WORKSPACE_SECRETS_KEY: ${WORKSPACE_SECRETS_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -d /tmp/stockmanager-job-heartbeats && find /tmp/stockmanager-job-heartbeats -name sourcing-cache-sweep -mmin -90 -print -quit | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 11m
    # Runs the hourly TrustedParts cache retention sweep through the shared
    # backend CLI. Each run is capped at 600s; failures are logged and the
    # loop sleeps on the same cadence before trying again.
    command: ["sh", "-c", "while true; do timeout 600 python -m app.cli.run_job sourcing-cache-sweep; rc=$$?; if [ $$rc -eq 124 ]; then echo 'sourcing-cache-sweep timed out after 600s (exit=124)'; elif [ $$rc -ne 0 ]; then echo \"sourcing-cache-sweep failed (exit=$$rc)\"; fi; sleep 3600; done"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  backend-cron-alerts:
    build: ./backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 256
    oom_kill_disable: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      # Same runtime config shape as backend. Keep POSTGRES_* discrete so
      # DATABASE_URL is assembled inside Settings without leaking the password
      # through docker inspect interpolation.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOAD_DIR: /data/uploads
      APP_ENV: prod
      CORS_ORIGINS: ${CORS_ORIGINS}
      WORKSPACE_SECRETS_KEY: ${WORKSPACE_SECRETS_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -d /tmp/stockmanager-job-heartbeats && find /tmp/stockmanager-job-heartbeats -name sourcing-alerts-evaluate -mmin -90 -print -quit | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 11m
    # Runs the 15-minute sourcing alert evaluator through the shared backend
    # CLI. Alert-level cooldowns enforce per-alert notification frequency.
    # Each run is capped at 600s; failures are logged and the loop continues.
    command: ["sh", "-c", "while true; do timeout 600 python -m app.cli.run_job sourcing-alerts-evaluate; rc=$$?; if [ $$rc -eq 124 ]; then echo 'sourcing-alerts-evaluate timed out after 600s (exit=124)'; elif [ $$rc -ne 0 ]; then echo \"sourcing-alerts-evaluate failed (exit=$$rc)\"; fi; sleep 900; done"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  web:
    build:
      # Context is the repo root so the Dockerfile can COPY both `web/` (sources)
      # and `deploy/nginx-web.conf` (SPA routing + /api/ proxy) in one image.
      context: .
      dockerfile: web/Dockerfile.prod
      # Vite reads VITE_* at build time and inlines them into the bundle. The
      # frontend Sentry DSN is a public token by design (it shows up in the
      # browser DevTools) — it identifies the project, not authorises writes.
      #
      # Source-map upload (SENTRY_AUTH_TOKEN / _ORG / _PROJECT) is handled
      # by the CI web-build job so the token never enters the Docker layer
      # cache (INFRA2-010). Do NOT add those args back here.
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.0}
        VITE_APP_VERSION: ${SENTRY_RELEASE:-}
        # Umami self-hosted analytics. Both empty → no tracker injected.
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-}
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    oom_kill_disable: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # `service_healthy` (rather than the bare `- backend`) makes the web
    # container hold off until the backend's healthcheck reports green.
    # Closes the post-deploy 502 window where nginx was already serving
    # but the backend hadn't finished alembic upgrade.
    depends_on:
      backend:
        condition: service_healthy
    # Loopback-only host port. Apache (on the host) reverse-proxies
    # parts.matescb.cz → 127.0.0.1:8091. See deploy/parts.matescb.cz.conf.
    ports:
      - "127.0.0.1:8091:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]

volumes:
  db_data:
  uploads:
