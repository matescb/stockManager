# Production compose for the parts-inventory app.
#
# Usage:
#   cp deploy/.env.prod.example .env.prod
#   # edit .env.prod (rotate SESSION_SECRET, set CORS_ORIGINS, set strong POSTGRES_PASSWORD)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences vs docker-compose.yml (dev):
#   - backend runs uvicorn WITHOUT --reload, with multiple workers
#   - backend host port is NOT published; only the proxy reaches it
#   - web is a static build served by an in-container nginx (see web/Dockerfile.prod)
#   - a dedicated `proxy` (nginx:alpine) terminates TLS and fronts everything on 80/443
#   - postgres has no host port published; access only over the docker network
#
# TLS / cert convention:
#   The `proxy` service mounts `./deploy/certs` into `/etc/nginx/certs` (read-only).
#   Drop your fullchain + private key in there as:
#     ./deploy/certs/fullchain.pem
#     ./deploy/certs/privkey.pem
#   Or replace the bind-mount with a named volume managed by an ACME sidecar
#   (e.g. nginx-proxy/acme-companion). See docs/deployment.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No host port published in prod — only `backend` reaches the DB at db:5432
    # over the docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOAD_DIR: /data/uploads
      APP_ENV: prod
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    # No `ports:` — only the proxy talks to the backend, on the docker network.
    expose:
      - "8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  web:
    build:
      # Context is the repo root so the Dockerfile can COPY both `web/` (sources)
      # and `deploy/nginx-web.conf` (SPA-routing config) in a single image.
      context: .
      dockerfile: web/Dockerfile.prod
    restart: unless-stopped
    # Serves the pre-built static `dist/` via nginx on container port 80.
    # Only the proxy reaches it.
    expose:
      - "80"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount your TLS material here (see top-of-file note).
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  db_data:
  uploads:
