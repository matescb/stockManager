# Production compose for the parts-inventory app.
#
# Usage:
#   cp deploy/.env.prod.example .env.prod
#   # edit .env.prod (rotate SESSION_SECRET, set CORS_ORIGINS, set strong POSTGRES_PASSWORD)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Architecture (matches the rest of this VPS — see docs/deployment.md):
#   - Public TLS termination + vhost routing happens in the host's Apache 2.4.
#   - This compose stack binds ONE host port (web on 127.0.0.1:8091); Apache
#     ProxyPass'es parts.matescb.cz to it.
#   - The web container's nginx handles the SPA-vs-API split: /api/* is proxied
#     to the backend container over the docker network; everything else is the
#     static Vite bundle.
#   - backend and db never publish a host port — only the docker network.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOAD_DIR: /data/uploads
      APP_ENV: prod
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Empty in unset / dev — SDK becomes a no-op.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      # Release identifier — populated by the deploy script with the
      # current git SHA so Sentry groups issues per release.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Frontend DSN, read by the backend solely so /api/sentry-tunnel
      # can allow-list its forwarder against the React project. Vite
      # also bakes this into the SPA bundle at build time (see web
      # service below).
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # --proxy-headers + --forwarded-allow-ips='*' make uvicorn rewrite
    # request.client.host from the X-Forwarded-For header that Apache
    # populates. Without it, every request looks like it came from the
    # docker bridge IP and the auth rate-limiter buckets all clients
    # together. '*' is safe here because Apache strips/sets XFF and is
    # the only thing reachable on the docker network.
    #
    # --workers 1: slowapi's in-memory bucket store is per-process, so
    # the effective auth rate-limit gets multiplied by the worker count.
    # We're nowhere near needing parallelism at our scale; if traffic
    # ever justifies > 1 worker, switch slowapi to a Redis backend
    # before bumping this number.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
                    --proxy-headers --forwarded-allow-ips='*'"

  web:
    build:
      # Context is the repo root so the Dockerfile can COPY both `web/` (sources)
      # and `deploy/nginx-web.conf` (SPA routing + /api/ proxy) in one image.
      context: .
      dockerfile: web/Dockerfile.prod
      # Vite reads VITE_* at build time and inlines them into the bundle. The
      # frontend Sentry DSN is a public token by design (it shows up in the
      # browser DevTools) — it identifies the project, not authorises writes.
      #
      # SENTRY_AUTH_TOKEN / _ORG / _PROJECT are required ONLY for source-map
      # upload during the build itself. Empty → sourcemap upload is skipped
      # and the bundle still ships fine; you just won't get readable stack
      # traces in Sentry. The auth token is sensitive — keep .env.prod
      # chmod 600 owned by `deploy`.
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.0}
        VITE_APP_VERSION: ${SENTRY_RELEASE:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
    restart: unless-stopped
    depends_on:
      - backend
    # Loopback-only host port. Apache (on the host) reverse-proxies
    # parts.matescb.cz → 127.0.0.1:8091. See deploy/parts.matescb.cz.conf.
    ports:
      - "127.0.0.1:8091:80"

volumes:
  db_data:
  uploads:
