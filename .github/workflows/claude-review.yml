name: claude-review

# Autonomous PR review + auto-merge gatekeeper.
# Logic lives in .claude/prompts/pr-watcher.md — keep this workflow thin.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

# One review at a time per PR — avoid two fires racing on the same SHA.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Skip drafts; for issue_comment events, only fire when the comment is on a PR.
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.draft == false
      || github.event_name == 'issue_comment' && github.event.issue.pull_request != null

    runs-on: ubuntu-latest

    steps:
      # SHA-pinned per the existing ci.yml convention; resolved 2026-05-02.
      # Bump via `gh api repos/<owner>/<repo>/git/refs/tags/<tag>`.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      # Push every `${{ … }}` through env vars before any shell sees it,
      # to neutralise the workflow-injection class of bug. The PR/issue
      # numbers are integers controlled by GitHub (not user input), but
      # the convention here is "no interpolation in run:".
      - name: Resolve PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_PR: ${{ github.event.pull_request.number }}
          PR_NUMBER_ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "number=$PR_NUMBER_PR" >> "$GITHUB_OUTPUT"
          else
            echo "number=$PR_NUMBER_ISSUE" >> "$GITHUB_OUTPUT"
          fi
