name: ci

on:
  push:
    branches: [main]
  pull_request:

# Don't cancel an in-flight deploy if a follow-up commit lands; queue it instead.
# A cancelled `docker compose up --build` mid-flight can leave the stack in a
# weird half-recreated state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockmgr
          POSTGRES_PASSWORD: stockmgr
          POSTGRES_DB: stockmgr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockmgr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (with dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://stockmgr:stockmgr@localhost:5432/stockmgr_test
        run: pytest -q --tb=short

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Vitest
        working-directory: web
        run: npm test

      - name: Type-check + bundle
        working-directory: web
        run: npm run build

  deploy:
    # Only redeploy on green main pushes. PRs and feature branches just run
    # the two test jobs above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, web-build]
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # If the VPS's host key ever rotates, pin it via `fingerprint:` here
          # (SHA256 form, captured with `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub`).
          script_stop: true
          script: |
            set -euo pipefail
            cd /srv/stockmanager
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker image prune -f
