name: ci

on:
  push:
    branches: [main]
  pull_request:

# Don't cancel an in-flight deploy if a follow-up commit lands; queue it instead.
# A cancelled `docker compose up --build` mid-flight can leave the stack in a
# weird half-recreated state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# Default token scope for the workflow. Tighter than the repo default,
# prevents a malicious dependency in test code from using the auto-issued
# GITHUB_TOKEN to push commits / open PRs / edit issues. Override per-job
# when a step needs more (none currently do).
permissions:
  contents: read

jobs:
  lockfile-drift:
    # SEC2-016: fail fast if pyproject.toml and uv.lock have diverged,
    # or if requirements.lock is out of sync with uv.lock.  Runs before
    # the heavier backend-tests job so the signal is immediate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check uv.lock is up to date
        working-directory: backend
        run: uv lock --check

      - name: Check requirements.lock matches uv.lock
        working-directory: backend
        run: |
          uv export --format requirements-txt --hashes --no-dev --no-emit-project -o /tmp/requirements_fresh.lock
          if ! diff -u <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements_fresh.lock); then
            echo "requirements.lock is stale — run: cd backend && uv export --format requirements-txt --hashes --no-dev --no-emit-project -o requirements.lock"
            exit 1
          fi

  pip-audit:
    # SEC2-016: scan the locked dependency set for HIGH/CRITICAL CVEs.
    # Runs after the lockfile is verified to be current.
    needs: [lockfile-drift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        working-directory: backend
        # --require-hashes mode means pip-audit operates on the pinned set,
        # not whatever the resolver might pick up at audit time.
        run: pip-audit --requirement requirements.lock --skip-editable

  npm-audit:
    # Issue #305: scan the locked npm dependency set for CVEs.
    # Hard-fails on any production (--omit=dev) CVE at moderate+.
    # Dev-only advisories are printed but non-blocking (known: vite/vitest/esbuild).
    # Mirrors the pip-audit job shape above for the Python side.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Audit production dependencies (blocking)
        working-directory: web
        run: npm audit --audit-level=moderate --omit=dev

      - name: Audit all dependencies including dev (warn only)
        working-directory: web
        run: npm audit --audit-level=moderate || true

  line-count-budget:
    # CQ-002 / CQ-003 paper-close guard. Caps the line count of files that
    # were intentionally split so they don't silently grow back. To raise a
    # cap, do it in the same PR that adds the lines and explain why in the
    # PR body — the cap is the policy, not an accident.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Enforce per-file line-count budgets
        run: |
          set -u
          fail=0
          check() {
            local f="$1" cap="$2"
            if [ ! -f "$f" ]; then
              echo "MISSING: $f (budget guard out of sync — update ci.yml)"
              fail=1
              return
            fi
            local n
            n=$(wc -l < "$f")
            if [ "$n" -gt "$cap" ]; then
              echo "OVER BUDGET: $f has $n lines (cap $cap)"
              fail=1
            else
              echo "ok: $f ($n / $cap)"
            fi
          }

          # CQ-002: backend parts route split
          check backend/app/api/routes/parts_core.py    700
          check backend/app/api/routes/parts_scan.py    700
          check backend/app/api/routes/parts_assets.py  400

          # CQ-003: frontend ScanImport split
          check web/src/routes/parts/ScanImport/ScanImportQueue.tsx    400
          check web/src/routes/parts/ScanImport/ScanImportSession.tsx  250
          check web/src/routes/parts/ScanImport/ScanImportActions.tsx  200
          check web/src/routes/parts/ScanImport.tsx                    250

          # Optional caps — guard against unbounded growth in other route
          # modules that are already on the larger side.
          check backend/app/api/routes/orders.py  400
          check backend/app/api/routes/stock.py   200
          check backend/app/api/routes/builds.py  300

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "One or more files exceeded their line-count budget."
            echo "Either split the file or raise the cap in this PR (with a reason in the PR body)."
            exit 1
          fi

  adr-cite-freshness:
    # AUD-134 / issue #832: ADR source citations are load-bearing onboarding
    # pointers. Fail when a backticked file:line or file:start-end cite points
    # outside the current tracked file.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Check ADR file-line cites
        run: scripts/check_adr_code_cites.py

  tp-schema-drift:
    # TPS-1 / issue #448: the bundled TrustedParts OpenAPI document and
    # generated Pydantic v2 models are committed artifacts. Regenerate from
    # the bundled schema and fail if the checked-in generated models are stale.
    # Do not fetch the live TrustedParts schema in CI; ADR-0022 keeps refresh
    # as an explicit operator action via `make refresh-tp-spec`.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --no-cache-dir uv==0.11.8

      - name: Install backend generation deps
        working-directory: backend
        run: uv sync --frozen --extra dev --dev

      - name: Regenerate TrustedParts models
        run: make regen-tp-models

      - name: Assert TrustedParts schema artifacts are current
        run: git diff --exit-code -- backend/app/domain/sourcing/_generated

  backend-tests:
    # Make the dependency on lockfile-drift explicit at the job level so the
    # ordering matches the comment on the lockfile-drift job (it runs *before*
    # backend-tests). The `uv lock --check` step inside this job is redundant
    # belt-and-braces; the `needs:` edge is the contract.
    needs: [lockfile-drift]
    runs-on: ubuntu-latest
    # Restate the minimum required permissions explicitly on each job so the
    # scope is visible next to the steps and survives any future change to the
    # workflow-level default (INFRA2-013).
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockmgr
          POSTGRES_PASSWORD: stockmgr
          POSTGRES_DB: stockmgr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockmgr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # SHA-pin every action so a tag-rewrite attack can't substitute a
      # malicious version. Comments record the human-readable tag the SHA
      # was resolved from on 2026-05-01; bump via
      # `gh api repos/<owner>/<repo>/git/refs/tags/<tag>`.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --no-cache-dir uv==0.11.8

      - name: Check lockfile is up to date
        working-directory: backend
        run: uv lock --check

      - name: Install backend (with dev extras)
        working-directory: backend
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Static analysis gate — CQ-005 / issue #253. Baseline-blocking:
      # fails only on NEW violations not present in .ruff-baseline.txt.
      # To update the baseline after intentional fixes, see
      # docs/development.md — "Updating lint baselines".
      - name: ruff
        working-directory: backend
        run: |
          LINT_CMD="ruff check app --output-format=concise" \
          BASELINE_FILE="../.ruff-baseline.txt" \
          WORK_DIR="." \
          bash ../scripts/lint-delta.sh

      # SEC2-018: fast pre-pytest gate — fail if any HTTPException passes
      # traceback / stack-trace data in its detail= argument.
      - name: check-no-traceback-leaks
        working-directory: backend
        run: python scripts/check_no_traceback_leaks.py

      # SEC2-020: reject any verify=False/trust_env=False/ssl=False in httpx
      # calls. Annotate with # noqa: tls-verify if the bypass is intentional.
      - name: TLS verify guard
        working-directory: backend
        run: |
          if grep -RnE "verify=False|trust_env=False|ssl=False" app/ --include="*.py" | grep -v "# noqa: tls-verify"; then
            echo "ERROR: Found verify=False/trust_env=False/ssl=False in httpx calls. Annotate with # noqa: tls-verify if intentional."
            exit 1
          fi

      # AUD-055: keep direct StockEntry() construction confined to the
      # ledger-writing services. Other code must use those services instead
      # of bypassing their workspace and append-only semantics.
      - name: StockEntry constructor guard
        working-directory: backend
        run: python scripts/check_stockentry_constructors.py

      - name: alembic single-head check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://stockmgr:stockmgr@localhost:5432/stockmgr_test
        run: |
          test "$(python -m alembic heads --resolve-dependencies 2>/dev/null | wc -l)" -eq 1 || \
            { echo "Multiple Alembic heads — two PRs claim the same down_revision. Rebase and renumber."; exit 1; }

      - name: pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://stockmgr:stockmgr@localhost:5432/stockmgr_test
        run: pytest -q --tb=short --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Upload backend coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
          if-no-files-found: warn
          retention-days: 14

  web-build:
    runs-on: ubuntu-latest
    # Restate minimum permissions explicitly (INFRA2-013).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Derive the release name once and reuse it for both the bundle build
      # (`VITE_APP_VERSION`) and the sourcemap upload. The VPS deploy step
      # uses `git rev-parse --short=12 HEAD` for `SENTRY_RELEASE`, which is
      # baked into the runtime bundle. We must produce the same 12-char
      # string here — otherwise sourcemaps are uploaded under the full
      # 40-char SHA but the runtime emits events tagged with the short SHA,
      # and Sentry can't unminify any production stack frame (issue #283).
      - name: Set release name
        id: release
        run: echo "name=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      # Static analysis gate — CQ-005 / issue #253. Baseline-blocking:
      # fails only on NEW violations not present in .eslint-baseline.txt.
      # To update the baseline after intentional fixes, see
      # docs/development.md — "Updating lint baselines".
      - name: eslint
        working-directory: web
        run: |
          LINT_CMD="npm run lint -- --format=unix" \
          BASELINE_FILE="../.eslint-baseline.txt" \
          WORK_DIR="." \
          bash ../scripts/lint-delta.sh

      - name: Vitest
        working-directory: web
        # --coverage emits to web/coverage/. No fail-under yet (TEST-013).
        run: npm test -- --coverage

      - name: Upload web coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: web-coverage
          path: web/coverage/
          if-no-files-found: warn
          retention-days: 14

      # INFRA2-015: expose SENTRY_AUTH_TOKEN to `vite build` only on
      # push to main (matching the upload step's gate below). The
      # `vite.config.ts` `emitSourcemaps` gate keys off `SENTRY_AUTH_TOKEN`
      # presence, so without this env block the build emits zero `.map`
      # files and the subsequent upload step ships nothing — regressing
      # INFRA2-010. PRs / feature branches still build with no token, so
      # no `.map` files are emitted off-main. The token never enters any
      # Docker build context — it only exists in the GitHub Actions runner
      # env for these two CI steps.
      - name: Type-check + bundle
        working-directory: web
        env:
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SENTRY_ORG || '' }}
          SENTRY_PROJECT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SENTRY_PROJECT || '' }}
          # Use the same 12-char short SHA the VPS deploy bakes into the
          # runtime bundle (`SENTRY_RELEASE` -> `VITE_APP_VERSION`). See
          # the "Set release name" step above and issue #283.
          VITE_APP_VERSION: ${{ steps.release.outputs.name }}
        run: npm run build

      # INFRA2-010: upload sourcemaps to Sentry from CI so the auth token
      # never enters the Docker build context / layer cache. Gated on push
      # to main so PRs don't upload (they'd pin maps to a SHA that never
      # ships). Skipped silently if the secret is absent (e.g. forks).
      - name: Upload sourcemaps to Sentry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # Same release identifier baked into the bundle above and into
          # the runtime image at deploy time (issue #283).
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          npx @sentry/cli sourcemaps upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --release "$RELEASE" \
            web/dist

  prod-validate:
    # INFRA2-012: validate docker-compose.prod.yml and build prod images so
    # Dockerfile / compose regressions are caught in CI instead of at deploy
    # time on the VPS (after git reset --hard has already swapped the tree).
    # AUD-049: also boot the prod compose web/backend/db path and run a tiny
    # unauthenticated Playwright smoke through nginx. Prod auth cookies are
    # Secure by design, so this intentionally does not exercise login over
    # the runner's plain HTTP loopback.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Forbid ad-hoc workspace db.get checks
        run: |
          matches=$(
            grep -R -n "db\.get(" backend/app/api/routes --include="*.py" | while IFS=: read -r file line _; do
              end=$((line + 3))
              if sed -n "${line},${end}p" "$file" | grep -qE "workspace_id[[:space:]]*!="; then
                echo "${file}:${line}: db.get followed by workspace_id != within 3 lines; use assert_in_workspace"
              fi
            done
          )
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Build a CI-safe .env from the checked-in example.  We substitute a
      # syntactically valid Fernet key so `docker compose config` resolves
      # every variable (the backend validator only rejects an empty key at
      # *runtime*, not at config-parse time, but having a well-formed value
      # avoids any compose-level "variable unset" warnings).
      - name: Create CI env file
        run: |
          cp deploy/.env.prod.example .env.prod.ci
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=stockmgr-prod-ci|' .env.prod.ci
          sed -i 's|^SESSION_SECRET=.*|SESSION_SECRET=ci-prod-smoke-session-secret-2026|' .env.prod.ci
          sed -i 's|^PASSWORD_PEPPER=.*|PASSWORD_PEPPER=ci-prod-smoke-password-pepper-2026|' .env.prod.ci
          sed -i 's|^CORS_ORIGINS=.*|CORS_ORIGINS=http://127.0.0.1:8091|' .env.prod.ci
          sed -i 's|^WORKSPACE_SECRETS_KEY=.*|WORKSPACE_SECRETS_KEY=ZDZkYjI4NzM0YTQ4MjNhODNhZGFkNzE3ZGVkMGY5YWU=|' .env.prod.ci
          sed -i 's|^SMTP_HOST=.*|SMTP_HOST=smtp.invalid|' .env.prod.ci
          sed -i 's|^SMTP_USER=.*|SMTP_USER=stockmgr-ci|' .env.prod.ci
          sed -i 's|^SMTP_PASSWORD=.*|SMTP_PASSWORD=stockmgr-ci-password|' .env.prod.ci
          sed -i 's|^MAIL_FROM=.*|MAIL_FROM=noreply@example.invalid|' .env.prod.ci
          sed -i 's|^APP_BASE_URL=.*|APP_BASE_URL=https://parts-ci.example.invalid|' .env.prod.ci

      - name: Install web deps
        working-directory: web
        run: npm ci

      # Validate compose YAML / schema / variable substitution. Fails on
      # malformed YAML, unknown keys, or missing required variables.
      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.ci config -q

      # Assert backend `command:` in the *raw* compose YAML is a list,
      # not a YAML folded scalar (string). See CLAUDE.md "Things that
      # have bitten us": a YAML folded scalar (`>`) silently turns
      # indented continuation lines into separate shell commands, which
      # once made slowapi bucket every client by the docker bridge IP.
      # The plain `config -q` step above accepts both forms (both are
      # valid compose schema), so we need this explicit shape check on
      # the source file.
      - name: Assert backend command is a list (regression guard)
        run: |
          python3 -c "
          import sys, yaml
          cfg = yaml.safe_load(open('docker-compose.prod.yml'))
          cmd = cfg['services']['backend'].get('command')
          if not isinstance(cmd, list):
              sys.exit(
                  f'backend.command must be a YAML list (JSON-array form), '
                  f'got {type(cmd).__name__}: {cmd!r}. See CLAUDE.md -> '
                  f'Things that have bitten us (folded-scalar regression).'
              )
          if not any('uvicorn' in str(p) for p in cmd):
              sys.exit(f'backend.command does not invoke uvicorn: {cmd!r}')
          "

      # Build the backend prod image. Catches broken COPY paths, missing
      # apt packages, pip install failures.
      - name: Build backend prod image
        run: |
          docker buildx build --load \
            -t stockmanager-backend-prod-validate:ci \
            -f backend/Dockerfile backend/

      # AUD-128 / issue #827: keep the backend-cron-sessions healthcheck
      # comfortably below its configured timeout. The probe runs inside an
      # already-started backend image so the timing measures cold Python import
      # and CLI work without adding container startup overhead.
      - name: Time backend-cron-sessions healthcheck probe
        run: |
          timeout_ms=$(python3 - <<'PY'
          import re
          import yaml

          cfg = yaml.safe_load(open("docker-compose.prod.yml"))
          timeout = cfg["services"]["backend-cron-sessions"]["healthcheck"]["timeout"]
          match = re.fullmatch(r"(\d+)s", str(timeout))
          if not match:
              raise SystemExit(f"unsupported backend-cron-sessions timeout: {timeout!r}")
          print(int(match.group(1)) * 1000)
          PY
          )
          threshold_ms=$((timeout_ms / 2))
          container=$(
            docker run -d \
              --env-file .env.prod.ci \
              -e SESSION_PURGE_INTERVAL_SECONDS=0 \
              -e PASSWORD_RESET_PURGE_INTERVAL_SECONDS=0 \
              stockmanager-backend-prod-validate:ci \
              sleep 60
          )
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          start_ns=$(date +%s%N)
          docker exec "$container" \
            python -m app.cli.run_job --check-all-heartbeats session-purge password-reset-purge --heartbeat-max-age-seconds 5400
          end_ns=$(date +%s%N)
          elapsed_ms=$(((end_ns - start_ns) / 1000000))
          echo "backend-cron-sessions probe elapsed ${elapsed_ms}ms; threshold ${threshold_ms}ms"
          python3 - <<PY
          elapsed_ms = int("${elapsed_ms}")
          threshold_ms = int("${threshold_ms}")
          if elapsed_ms > threshold_ms:
              raise SystemExit(
                  f"backend-cron-sessions healthcheck probe took {elapsed_ms}ms, "
                  f"exceeding timeout/2 budget {threshold_ms}ms"
              )
          PY

      # Build the web prod image (context = repo root, matching compose).
      # Catches Dockerfile syntax errors, broken npm build, nginx config
      # copy errors. SENTRY_AUTH_TOKEN is intentionally absent — the Vite
      # plugin no-ops on an empty token (INFRA2-010).
      - name: Build web prod image
        run: |
          docker buildx build --load -f web/Dockerfile.prod \
            --build-arg VITE_SENTRY_TRACES_SAMPLE_RATE=0.05 \
            --build-arg VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=0.0 \
            --build-arg VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE=0.0 \
            .

      # Lint the in-container nginx config. Catches syntax errors in
      # deploy/nginx-web.conf before they reach the running stack.
      - name: Lint nginx config
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            -v "$PWD/deploy/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      # FB-005: lint the Apache vhosts and maintenance drop-in before they
      # reach /etc/apache2 on the VPS. Enable the modules referenced by the
      # checked-in configs so apache2ctl validates the same directive set.
      - name: Lint Apache configs
        run: |
          docker run --rm \
            -v "$PWD/deploy:/work/deploy:ro" \
            debian:bookworm-slim sh -ec '
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends apache2 ca-certificates openssl >/dev/null
              a2enmod headers proxy proxy_http rewrite ssl >/dev/null
              mkdir -p /etc/letsencrypt/live/parts.matescb.cz
              openssl req -x509 -nodes -newkey rsa:2048 \
                -keyout /etc/letsencrypt/live/parts.matescb.cz/privkey.pem \
                -out /etc/letsencrypt/live/parts.matescb.cz/fullchain.pem \
                -subj /CN=parts.matescb.cz -days 1 >/dev/null 2>&1
              touch /etc/letsencrypt/options-ssl-apache.conf
              cp /work/deploy/parts.matescb.cz.conf /etc/apache2/sites-available/parts.matescb.cz.conf
              cp /work/deploy/parts.matescb.cz-le-ssl.conf /etc/apache2/sites-available/parts.matescb.cz-le-ssl.conf
              cp /work/deploy/parts.matescb.cz.maintenance.conf /etc/apache2/conf-available/parts-maintenance.conf
              a2ensite parts.matescb.cz parts.matescb.cz-le-ssl >/dev/null
              a2enconf parts-maintenance >/dev/null
              apache2ctl configtest
            '

      # FB-005: the outage page is served directly by Apache, outside the SPA
      # stack, so catch malformed HTML in the deploy validation gate.
      - name: Lint maintenance HTML
        run: |
          docker run --rm \
            -v "$PWD/deploy/maintenance.html:/work/maintenance.html:ro" \
            debian:bookworm-slim sh -ec '
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tidy >/dev/null
              tidy -q -e /work/maintenance.html
            '

      # INFRA-005 (issue #46) smoke tests — verify the built images actually
      # start and have the expected entrypoint files. Catches missing modules
      # / wrong WORKDIR / broken bundles that pure `build` doesn't surface.
      - name: Backend image smoke test (import app.main)
        run: |
          IMAGE=$(docker buildx build --load -f backend/Dockerfile -q backend/)
          docker run --rm "$IMAGE" python -c "import app.main"

      - name: Web image smoke test (SPA bundle present)
        run: |
          IMAGE=$(docker buildx build --load -f web/Dockerfile.prod \
            --build-arg VITE_SENTRY_TRACES_SAMPLE_RATE=0.05 \
            --build-arg VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=0.0 \
            --build-arg VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE=0.0 \
            -q .)
          docker run --rm "$IMAGE" test -f /usr/share/nginx/html/index.html

      - name: Start prod compose smoke stack
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.ci up -d --build db backend-init backend web

      - name: Wait for prod /api/health through nginx (30 x 5s)
        run: |
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8091/api/health > /dev/null 2>&1; then
              echo "prod /api/health OK after ${i} attempt(s) ($((i*5))s)"
              ok=1
              break
            fi
            sleep 5
          done
          if [ "${ok}" -ne 1 ]; then
            echo "prod /api/health never became healthy — dumping compose state:"
            docker compose -f docker-compose.prod.yml --env-file .env.prod.ci ps || true
            docker compose -f docker-compose.prod.yml --env-file .env.prod.ci logs --tail=100 backend web || true
            exit 1
          fi

      - name: Install Playwright + Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright @prod-smoke suite
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:8091"
          PLAYWRIGHT_PROJECT_SET: "prod-smoke"
          CI: "true"
        run: npx playwright test prod-smoke.spec.ts --project=prod-smoke

      - name: Upload prod Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: prod-playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Dump prod compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.ci logs --tail=100 backend web || true

      - name: Tear down prod compose smoke stack
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.ci down -v

  playwright-e2e:
    # TEST-004 / issue #256: run the @smoke Playwright suite against the dev
    # docker-compose stack so E2E breakage is caught before deploy.
    # Uses docker-compose.dev.yml (NOT prod) — APP_ENV=dev keeps session
    # cookies over plain HTTP (see CLAUDE.md "Session cookie secure is gated").
    needs: [web-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: ./.github/actions/playwright-setup

      - name: Run Playwright @smoke suite
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:5173"
          CI: "true"
        run: npx playwright test --project=smoke

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail=100 backend || true

      - name: Tear down dev stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  playwright-core:
    # E2E-1 / issue #686: advisory @core suite. It is label-gated while
    # coverage grows so deploy remains gated only on the one @smoke walk.
    if: >
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'area:frontend') ||
      contains(github.event.pull_request.labels.*.name, 'area:testing'))
    needs: [web-build]
    continue-on-error: true
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: ./.github/actions/playwright-setup

      - name: Forbid waitForTimeout in spec files
        run: |
          if grep -rn "waitForTimeout" web/e2e --include="*.spec.ts"; then
            echo "::error::waitForTimeout is banned in spec files. Use waitFor/expect.poll/route handlers instead."
            exit 1
          fi

      - name: Run Playwright @core suite
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:5173"
          CI: "true"
        run: npx playwright test --project=core --pass-with-no-tests

      - name: Upload Playwright core report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: playwright-core-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail=100 backend || true

      - name: Tear down dev stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  ci-policy:
    # Issue #307: meta-gate that asserts every quality-gate job in this
    # workflow is wired into `deploy: needs:`. Closes the recurring
    # failure class where a new gate is added but silently skipped on
    # deploy:
    #   #282 — pip-audit / lockfile-drift not gating
    #   #283 — sourcemap SHA mismatch (gate-existence variant)
    #   #303 — line-count-budget not gating
    # The doc note at the top of the deploy: block ("If you add a new
    # pre-deploy gate, add it here too") was the previous enforcement
    # mechanism. It depends on contributor discipline and has failed at
    # least three times. This job parses ci.yml itself and fails loudly
    # if any non-excluded job is absent from `deploy.needs`. It is itself
    # listed in `deploy.needs` so it cannot be silently bypassed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Assert every quality gate is wired into deploy.needs
        run: |
          python3 - <<'PY'
          import sys, pathlib, yaml

          WORKFLOW = ".github/workflows/ci.yml"
          # Jobs intentionally NOT required to gate deploy:
          #   - deploy itself (it can't depend on itself).
          #   - advisory or scheduled-only jobs documented in EXCLUDE below.
          # Add a job name here only with a comment explaining why it is
          # not a quality gate. The default — and safe — assumption is
          # that any new top-level job IS a gate.
          EXCLUDE = {
              "deploy",
              # playwright-core is advisory until @core has a 100-run green streak;
              # promotion to deploy-gating is a one-line change (remove from EXCLUDE,
              # add to deploy.needs). See E2E epic plan.
              "playwright-core",
          }

          cfg = yaml.safe_load(pathlib.Path(WORKFLOW).read_text())
          jobs = cfg["jobs"]
          all_jobs = set(jobs.keys())
          gate_jobs = all_jobs - EXCLUDE

          deploy_needs = list(jobs["deploy"].get("needs") or [])

          # Resolve transitive needs: if A is in deploy.needs and B is in
          # A.needs, then B is effectively gating deploy. Walk the graph
          # so the check matches GitHub Actions' real semantics. The
          # deploy: block's own comment still requires direct listing for
          # human visibility; this script enforces effective gating.
          def transitive_needs(seeds):
              seen = set()
              stack = list(seeds)
              while stack:
                  cur = stack.pop()
                  if cur in seen:
                      continue
                  seen.add(cur)
                  stack.extend(jobs.get(cur, {}).get("needs") or [])
              return seen

          effective_needs = transitive_needs(deploy_needs)
          missing = sorted(gate_jobs - effective_needs)

          if missing:
              print("ERROR: these quality jobs run on PRs but are NOT in 'deploy: needs:'")
              for m in missing:
                  print(f"  - {m}")
              print()
              print("Fix: add the missing job(s) to the `deploy: needs:` array")
              print("in .github/workflows/ci.yml — or, if a job is intentionally")
              print("non-gating, add it to EXCLUDE in the ci-policy job with a")
              print("comment explaining why.")
              sys.exit(1)

          print(
              f"OK: all {len(gate_jobs)} gate jobs are required by deploy "
              f"(direct or transitive): {sorted(gate_jobs)}"
          )
          PY

  # deploy: gates on every quality and security job. The `needs:` list below
  # must enumerate every gate *directly*, not transitively — otherwise a green
  # transitive parent can let a red security-class job slip past (the original
  # SEC2-016 hole that issue #282 closes).
  #
  # Current gates, in dependency order:
  #   - ci-policy         (#307)       — meta-gate, asserts this list is complete
  #   - lockfile-drift    (SEC2-016)   — pyproject ↔ uv.lock ↔ requirements.lock
  #   - pip-audit         (SEC2-016)   — HIGH/CRITICAL CVEs in the pinned set
  #   - npm-audit         (issue #305) — CVEs in the npm production dep set
  #   - line-count-budget (CQ-002/003) — per-file line-count caps
  #   - adr-cite-freshness (#832)      — ADR file:line cite freshness
  #   - tp-schema-drift   (#448)       — TrustedParts schema/model drift
  #   - backend-tests                  — pytest + alembic
  #   - web-build                      — tsc -b + vite build (+ sourcemap upload)
  #   - prod-validate                  — docker compose config/build + prod smoke
  #   - playwright-e2e                 — full-stack smoke
  #
  # If you add a new pre-deploy gate (lint, secrets-scan, SBOM, smoke, …), add
  # it here too, even if it already chains transitively through some other job.
  # The `ci-policy` job above will fail CI if you forget.
  deploy:
    # Only redeploy on green main pushes. PRs and feature branches just run
    # the test/validate/security jobs above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-policy, lockfile-drift, pip-audit, npm-audit, line-count-budget, adr-cite-freshness, tp-schema-drift, backend-tests, web-build, prod-validate, playwright-e2e]
    runs-on: ubuntu-latest
    # Environment association. Today this just scopes any environment-level
    # secrets we add later; if a "Required reviewers" protection rule is
    # configured for `production` in the repo's GitHub Settings → Environments,
    # this job will pause for human approval before each deploy. See
    # docs/deployment.md → "Optional: gate deploys behind a human reviewer".
    environment: production
    # Restate minimum permissions explicitly (INFRA2-013). The deploy uses
    # SSH, not git push, so no write scope is needed here either.
    permissions:
      contents: read

    steps:
      - name: Verify deploy ED25519 host key
        id: deploy_host_key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          ed25519_known_hosts="${RUNNER_TEMP}/deploy_ed25519_known_hosts"

          ssh-keyscan -T 10 -t ed25519 "${DEPLOY_HOST}" > "${ed25519_known_hosts}"
          if [ ! -s "${ed25519_known_hosts}" ]; then
            echo "No ED25519 host key returned for DEPLOY_HOST."
            exit 1
          fi

          actual_fingerprint=$(ssh-keygen -lf "${ed25519_known_hosts}" | awk 'NR == 1 {print $2}')
          if [ "${actual_fingerprint}" != "${DEPLOY_HOST_FINGERPRINT}" ]; then
            echo "DEPLOY_HOST_FINGERPRINT mismatch for DEPLOY_HOST."
            echo "Expected: ${DEPLOY_HOST_FINGERPRINT}"
            echo "Actual:   ${actual_fingerprint}"
            exit 1
          fi

          echo "known_hosts=${ed25519_known_hosts}" >> "${GITHUB_OUTPUT}"

      - name: SSH deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ steps.deploy_host_key.outputs.known_hosts }}
        run: |
          set -euo pipefail

          if [ ! -s "${DEPLOY_KNOWN_HOSTS}" ]; then
            echo "Verified ED25519 known_hosts file is missing."
            exit 1
          fi

          key_file="${RUNNER_TEMP}/deploy_ssh_key"
          umask 077
          python3 - "${key_file}" <<'PY'
          import os
          import sys

          key = os.environ.get("DEPLOY_SSH_KEY", "")
          key = key.replace("\\n", "\n").replace("\r\n", "\n").replace("\r", "\n")
          key = key.strip()
          if not key:
              raise SystemExit("DEPLOY_SSH_KEY is empty.")

          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              fh.write(key + "\n")
          PY
          chmod 600 "${key_file}"
          ssh-keygen -y -f "${key_file}" > /dev/null
          trap 'rm -f "${key_file}"' EXIT

          ssh -i "${key_file}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS}" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -se' <<'REMOTE_DEPLOY'
          set -euo pipefail
          cd /srv/stockmanager
          git fetch --quiet origin main
          git reset --hard origin/main
          # Tag this deploy with the short SHA — exposed to both the
          # backend (SENTRY_RELEASE) and the frontend Vite build
          # (VITE_APP_VERSION) so Sentry groups issues per release
          # and source-map upload pins maps to it. Exported, not
          # appended to .env.prod, so the SHA isn't persisted between
          # deploys.
          export SENTRY_RELEASE
          SENTRY_RELEASE=$(git rev-parse --short=12 HEAD)

          if [ ! -f .env.prod ]; then
            echo ".env.prod is missing on the VPS; aborting before touching containers."
            exit 1
          fi

          pepper_line=$(grep -E '^PASSWORD_PEPPER=' .env.prod | tail -n 1 || true)
          pepper_value="${pepper_line#PASSWORD_PEPPER=}"
          if [ -z "${pepper_line}" ] || [ -z "${pepper_value}" ] || [ "${pepper_value}" = "replace-me-with-the-output-of-openssl-rand-hex-32" ]; then
            echo "PASSWORD_PEPPER is missing or still the template placeholder in .env.prod."
            echo "Run 'make bootstrap-pepper' on the VPS as deploy, escrow the generated value, then rerun deploy."
            exit 1
          fi
          echo "PASSWORD_PEPPER present in .env.prod."

          # FB-005: keep users on the static Apache page during the deploy
          # window. The trap is deliberately registered before the first
          # deploy-side effect so failed dumps, builds, migrations, or health
          # gates do not leave maintenance mode enabled indefinitely.
          disable_maintenance() {
            sudo -n a2disconf parts-maintenance && sudo -n systemctl reload apache2 || true
          }
          trap disable_maintenance EXIT
          if sudo -n a2enconf parts-maintenance && sudo -n systemctl reload apache2; then
            echo "Apache maintenance mode enabled for deploy."
          else
            echo "WARNING: could not enable Apache maintenance mode; continuing deploy."
          fi

          # Pre-deploy DB snapshot (INFRA2-001 / Infra CRIT-1).
          # Runs before `docker compose up` so the pre-migration state
          # of the running Postgres is captured. Fails loud — if the
          # dump can't be written, the deploy aborts here and the old
          # containers keep serving the old code.
          bash deploy/predeploy-dump.sh "${SENTRY_RELEASE}"

          if ! docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build; then
            echo "docker compose up failed — current service state:"
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps || true
            echo "--- backend-init logs (tail) ---"
            docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=120 backend-init || true
            echo "--- backend logs (tail) ---"
            docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=120 backend || true
            exit 1
          fi
          docker image prune -f

          # Post-deploy health gate (INFRA2-002 / Infra HIGH-1/7/8).
          # Polls the public health endpoint until 200 — covers the
          # rebuild window plus alembic upgrade plus first-request
          # warm-up. The 30 × 5s = 150s ceiling is generous for our
          # one-worker stack; tighten if it routinely takes less.
          # On failure the SSH script exits non-zero, which fails the
          # deploy job and surfaces in GitHub Actions instead of
          # leaving prod broken with a green CI badge.
          echo "post-deploy health gate"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS https://parts.matescb.cz/api/health > /dev/null 2>&1; then
              echo "  /api/health OK after ${i} attempts ($((i*5))s)"
              ok=1
              break
            fi
            sleep 5
          done
          if [ "${ok}" -ne 1 ]; then
            echo "post-deploy health gate FAILED — last response:"
            curl -v https://parts.matescb.cz/api/health || true
            echo "--- backend logs (tail) ---"
            docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=80 backend || true
            exit 1
          fi
          REMOTE_DEPLOY
