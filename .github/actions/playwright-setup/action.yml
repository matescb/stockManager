name: Playwright setup
description: Shared setup for Playwright jobs against the dev compose stack.

inputs:
  node-version:
    description: Node.js version for the web toolchain.
    default: "20"
  health-timeout-seconds:
    description: Seconds to wait for /api/health.
    default: "60"

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Create dev .env
      shell: bash
      run: cp .env.example .env

    - name: Install web deps
      shell: bash
      working-directory: web
      run: npm ci

    - name: Start dev stack
      shell: bash
      run: docker compose -f docker-compose.dev.yml up -d --build

    - name: Wait for /api/health
      shell: bash
      run: |
        ok=0
        deadline=$((SECONDS + ${{ inputs.health-timeout-seconds }}))
        attempt=0
        while [ "${SECONDS}" -lt "${deadline}" ]; do
          attempt=$((attempt + 1))
          if curl -fsS http://localhost:8000/api/health > /dev/null 2>&1; then
            echo "/api/health OK after ${attempt} attempt(s)"
            ok=1
            break
          fi
          sleep 2
        done
        if [ "${ok}" -ne 1 ]; then
          echo "/api/health never became healthy — dumping backend logs:"
          docker compose -f docker-compose.dev.yml logs --tail=80 backend || true
          exit 1
        fi

    - name: Wait for web (vite :5173 + its /api proxy)
      shell: bash
      run: |
        # The backend health wait above only proves :8000. The @smoke suite
        # drives PLAYWRIGHT_BASE_URL (:5173, the vite dev container) and its
        # very first call is POST :5173/api/auth/signup, which vite proxies
        # to backend:8000. If :5173 isn't serving yet the request comes back
        # "socket hang up" — a flake that, on a post-merge run, FAILS
        # playwright-e2e and thereby SKIPS the gated deploy (deploy needs it).
        #
        # Root cause of the slowness: the dev web service command is
        # `npm install && npm run dev` (docker-compose.dev.yml) over a
        # web_node_modules volume that `down -v` wipes every run, so a COLD
        # npm install runs at container start before vite serves. Under npm
        # registry stress that easily exceeds the 60s backend budget — hence
        # this step gets its own generous 300s window, polling the exact
        # proxied path the smoke test uses so readiness is proven end-to-end
        # before Playwright installs and runs.
        ok=0
        deadline=$((SECONDS + 300))
        attempt=0
        while [ "${SECONDS}" -lt "${deadline}" ]; do
          attempt=$((attempt + 1))
          if curl -fsS http://localhost:5173/api/health > /dev/null 2>&1; then
            echo "web :5173 + /api proxy OK after ${attempt} attempt(s) (~$((attempt * 3))s)"
            ok=1
            break
          fi
          sleep 3
        done
        if [ "${ok}" -ne 1 ]; then
          echo "web :5173 never proxied /api within 300s — dumping web container state:"
          docker compose -f docker-compose.dev.yml ps || true
          docker compose -f docker-compose.dev.yml logs --tail=120 web || true
          exit 1
        fi

    - name: Install Playwright + Chromium
      shell: bash
      working-directory: web
      run: npx playwright install --with-deps chromium
