# In-container nginx config for the `web` service in docker-compose.prod.yml.
#
# Serves the Vite static bundle with SPA-aware routing AND proxies the
# backend's surfaces — /api/*, plus the two that live outside it,
# /catalog/* and /kicad-api/* — to the backend container. The host-side
# Apache proxies `/` wholesale to this container, matching the per-app
# vhost convention on this VPS, so anything nginx doesn't route here
# never reaches uvicorn at all.
#
# Copied to /etc/nginx/conf.d/default.conf by web/Dockerfile.prod.

server_tokens off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow datasheet / lot photo uploads up to 25MB.
    client_max_body_size 25m;

    # ---- security headers (SEC2-009 / SEC2-010) ----
    # `always` so they're attached even on error responses (4xx/5xx),
    # which the default `add_header` skips.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: SPA bundle is self-hosted; the only third-party connect we
    # make is the Sentry tunnel (proxied via /api/sentry-tunnel) and the
    # ingest fallback during transient outages — hence
    # https://*.ingest.sentry.io in connect-src. `style-src 'unsafe-inline'`
    # is required by Vite's hashed inline critical CSS; revisit once we
    # adopt nonces.
    #
    # `blob:` in img-src is for the KiCad preview viewer: KiCanvas builds
    # its toolbar icon sprite sheet at runtime with
    # `URL.createObjectURL(new Blob([svg]))` and references it as
    # `<use xlink:href="blob:…#zoom_page">`, which the browser fetches
    # under img-src. Without it the zoom buttons render as blank boxes.
    # Deliberately scoped to images — the viewer needs no blob: script,
    # style or font, and default-src must stay 'self'.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.ingest.sentry.io; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;
    # Permissions-Policy: bare `()` is invalid (no feature name) and is
    # silently ignored by browsers. We need camera=(self) for the in-app
    # scanner (web/src/components/scanner/ZxingScanner.tsx + Scandit) and
    # everything else explicitly off to neuter the rest of the surface.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;

    # ---- Long-running import routes (BOM + scan) → extended timeouts ----
    # Must appear BEFORE the generic /api/ block so nginx's more-specific
    # regex match wins.  BOM imports and scan-to-import can write hundreds
    # of rows on a small VPS and routinely exceed the 60s default, causing
    # nginx to return 504 while the backend is still working (INFRA2-019).
    location ~ ^/api/(projects/[^/]+/bom/import|parts/bulk-import-from-scan) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
        proxy_hide_header Server;
    }

    # ---- /api/* → FastAPI (uvicorn) on the docker network ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        # SEC2-018: strip the upstream "Server: uvicorn" header so the
        # stack identity is not advertised to clients.
        proxy_hide_header Server;
    }

    # ---- Non-/api backend surfaces → FastAPI ----
    #
    # These MUST be listed explicitly. The SPA fallback at the bottom of
    # this file swallows any path nginx doesn't route, and a fallback hit
    # returns `200 text/html` — which is worse than a 502 for both
    # consumers here:
    #
    #  * KiCad's HTTP library checks the status code and nothing else, so
    #    it accepts the index page and then throws while parsing it. The
    #    user sees a broken library with no usable error.
    #  * The public catalog link handed to a customer renders the SPA
    #    shell, which then 401s them out of a page that needs no login.
    #
    # Any new router mounted outside /api needs a block here.
    # `tests/test_deploy_nginx_routes.py` fails the build if one is
    # missing.
    location /kicad-api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_hide_header Server;
    }

    location /catalog/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_hide_header Server;
    }

    # ---- MCP server (ADR-0030) ----
    #
    # `= /mcp` and `/mcp/` both, because the server answers on either and
    # a client that posts to the bare path must not be redirected — MCP
    # clients do not follow a 307 on a JSON-RPC POST.
    #
    # Two settings differ from the blocks above, and both are required
    # rather than cautious:
    #
    #  * `proxy_buffering off` — the transport replies with
    #    `text/event-stream`. With nginx's default buffering the whole
    #    response is held until the upstream closes, so a client sees
    #    nothing until the call has already finished.
    #  * `proxy_read_timeout 5m` — a tool call can run a vendor-archive
    #    import or an LCSC fetch, which the 60s default would cut off
    #    mid-write. Same reasoning as the BOM-import block at the top of
    #    this file.
    #
    # `client_max_body_size` is inherited from the server block (25m),
    # which covers the 4 MiB decoded cap on base64 tool arguments with
    # room for the encoding overhead.
    location = /mcp {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        proxy_read_timeout 5m;
        proxy_hide_header Server;
    }

    location /mcp/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        proxy_read_timeout 5m;
        proxy_hide_header Server;
    }

    # Long cache for hashed assets emitted by Vite.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ZXing wasm — content is bound to the package version, copied in at
    # build time by web/scripts/copy-zxing-wasm.mjs. Treat it like a hashed
    # asset: aggressive immutable cache so returning visitors don't pay the
    # ~1 MB redownload.
    location /zxing/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        types {
            application/wasm wasm;
        }
        try_files $uri =404;
    }

    # KiCanvas — the vendored KiCad 2D viewer, loaded on demand by the
    # part CAD tab (web/src/components/eda/kicanvas.ts).
    #
    # Deliberately NOT `immutable`, unlike /assets/ and /zxing/ above. This
    # URL is stable across viewer upgrades: the filename carries no content
    # hash and no version, so bumping the pinned commit reuses the very
    # same path. A year-long immutable cache would pin every returning
    # visitor to whichever build they happened to fetch first, with no way
    # to invalidate short of renaming the file. Ten minutes with
    # revalidation keeps the ~470 KB off repeat views while letting a
    # deploy actually take effect.
    location /kicanvas/ {
        access_log off;
        add_header Cache-Control "max-age=600, must-revalidate";
        try_files $uri =404;
    }

    # Never cache the SPA shell — it references the hashed assets above.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any unknown path falls through to index.html so the
    # client-side router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
