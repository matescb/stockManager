# In-container nginx config for the `web` service in docker-compose.prod.yml.
#
# Serves the Vite static bundle with SPA-aware routing AND proxies /api/* to
# the backend container — so the host-side Apache only needs to reverse-proxy
# this one container, matching the per-app vhost convention on this VPS.
#
# Copied to /etc/nginx/conf.d/default.conf by web/Dockerfile.prod.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow datasheet / lot photo uploads up to 25MB.
    client_max_body_size 25m;

    # ---- /api/* → FastAPI (uvicorn) on the docker network ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    # Long cache for hashed assets emitted by Vite.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ZXing wasm — content is bound to the package version, copied in at
    # build time by web/scripts/copy-zxing-wasm.mjs. Treat it like a hashed
    # asset: aggressive immutable cache so returning visitors don't pay the
    # ~1 MB redownload.
    location /zxing/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        types {
            application/wasm wasm;
        }
        try_files $uri =404;
    }

    # Never cache the SPA shell — it references the hashed assets above.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any unknown path falls through to index.html so the
    # client-side router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
