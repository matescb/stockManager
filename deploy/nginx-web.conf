# In-container nginx config for the `web` service in docker-compose.prod.yml.
# Serves the static Vite build with SPA-aware routing.
#
# This file is copied to /etc/nginx/conf.d/default.conf by web/Dockerfile.prod.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed assets emitted by Vite.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the SPA shell — it references the hashed assets above.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any unknown path falls through to index.html so the
    # client-side router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
