# Apache 2.4 vhost for parts.matescb.cz.
#
# This file is the canonical source kept under version control. The actual
# active vhost on the VPS lives at:
#
#   /etc/apache2/sites-available/parts.matescb.cz.conf
#   /etc/apache2/sites-enabled/parts.matescb.cz.conf      (symlink, via a2ensite)
#
# After certbot --apache runs once, a sibling file
# /etc/apache2/sites-enabled/parts.matescb.cz-le-ssl.conf is generated for the
# :443 vhost — that one is owned by certbot's renewal flow, not this repo.
#
# Pattern matches the existing odbor.matescb.cz / icicle.cz vhosts on this VPS.

<VirtualHost *:80>
    ServerName parts.matescb.cz
    DocumentRoot /var/www/html

    ProxyPreserveHost On
    # Let certbot serve HTTP-01 challenges from the filesystem rather than
    # trying to proxy them to the app.
    ProxyPass /.well-known !
    # retry=2: on a 502 Apache retries the backend up to 2 more times before
    # giving up, bridging short container-restart windows.
    # timeout=300: upstream read timeout raised to 5 m to cover BOM + scan-import
    #   routes (INFRA2-019). Matches the in-container nginx proxy_read_timeout.
    # connectiontimeout=5: fast-fail if the backend hasn't bound the port yet.
    ProxyPass / http://127.0.0.1:8091/ retry=2 timeout=300 connectiontimeout=5
    ProxyPassReverse / http://127.0.0.1:8091/

    # Serve the static maintenance page for backend outage responses while
    # leaving application-owned 4xx/5xx bodies untouched.
    ProxyErrorOverride On 502 503 504
    ErrorDocument 502 /maintenance.html
    ErrorDocument 503 /maintenance.html
    ErrorDocument 504 /maintenance.html
    Alias /maintenance.html /srv/stockmanager/deploy/maintenance.html
    <Directory "/srv/stockmanager/deploy">
        <Files "maintenance.html">
            Require all granted
        </Files>
    </Directory>

    # Tell clients (especially mobile webviews) to retry in ~10s on any 5xx.
    Header always set Retry-After "10" "expr=%{REQUEST_STATUS} == 502 || %{REQUEST_STATUS} == 503 || %{REQUEST_STATUS} == 504"

    # Datasheet + lot photo uploads can run a few MB each.
    LimitRequestBody 26214400

    ErrorLog ${APACHE_LOG_DIR}/parts.matescb.cz-error.log
    CustomLog ${APACHE_LOG_DIR}/parts.matescb.cz-access.log combined
</VirtualHost>
