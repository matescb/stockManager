# Reverse-proxy / TLS-termination config for the `proxy` service in
# docker-compose.prod.yml.
#
# - Terminates TLS on :443
# - Redirects all :80 traffic to :443
# - Proxies /api/* to the backend container (uvicorn on :8000)
# - Proxies everything else to the static-web container (nginx on :80)
# - Sets sensible security headers and gzip
#
# TLS cert convention: drop your fullchain + key at:
#   ./deploy/certs/fullchain.pem
#   ./deploy/certs/privkey.pem
# (mounted into /etc/nginx/certs by docker-compose.prod.yml).

user  nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;

    # Allow larger uploads (CSV BOM imports, lot photos, etc.). Adjust to taste.
    client_max_body_size 25m;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- shared upstreams ----
    upstream backend_upstream {
        server backend:8000;
    }

    upstream web_upstream {
        server web:80;
    }

    # Common proxy bits reused below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ---- HTTP -> HTTPS redirect ----
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Allow HTTP-01 ACME challenges if you front this with a sidecar that
        # writes them to a shared volume mounted at /var/www/certbot.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS termination + reverse proxy ----
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # ---- security headers ----
        # HSTS — only enable once you're sure HTTPS works on every host you serve.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "DENY"                                always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header Referrer-Policy           "no-referrer-when-downgrade"          always;

        # ---- /api/* → FastAPI (uvicorn) ----
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # Pass cookies through unchanged — the auth cookie path is `/`
            # and the session is httpOnly + samesite=lax already.
            proxy_read_timeout 60s;
        }

        # ---- everything else → static web (SPA) ----
        location / {
            proxy_pass http://web_upstream;
        }
    }
}
