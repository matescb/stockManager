<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="30">
  <title>Maintenance - Parts Inventory</title>
  <style>
    /* Mirrors the brand palette from web/src/index.css. */
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #dbeafe;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --ok: #16a34a;
      --shadow: rgba(15, 23, 42, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(180deg, rgba(239, 246, 255, 0.78), rgba(248, 250, 252, 0.96)),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 34rem);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      box-shadow: 0 18px 50px var(--shadow);
      padding: clamp(2rem, 5vw, 3.25rem);
      text-align: center;
    }

    .brand {
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--ok);
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 999px;
      padding: 0.42rem 0.9rem;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .dot {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.42);
      animation: pulse 1.7s ease-out infinite;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(1.75rem, 4vw, 2.35rem);
      line-height: 1.14;
      font-weight: 700;
    }

    p {
      margin: 1rem auto 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 1rem;
      max-width: 27rem;
    }

    .retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1.75rem;
      padding: 0.55rem 1rem;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.42);
      }
      70% {
        box-shadow: 0 0 0 0.7rem rgba(22, 163, 74, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(22, 163, 74, 0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Parts Inventory</div>
    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      <span>Maintenance in progress</span>
    </div>
    <h1>We'll be back in a moment</h1>
    <p>
      Parts Inventory is temporarily offline while we finish an update or recover
      the backend service. Thanks for your patience - your data is safe.
    </p>
    <div class="retry">This page retries automatically every 30 seconds</div>
  </main>
</body>
</html>
