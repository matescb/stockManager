<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maintenance — Parts Inventory</title>
  <style>
    /* Mirrors the brand palette from web/src/index.css */
    :root {
      --bg:      #f8fafc;
      --surface: #ffffff;
      --border:  #e2e8f0;
      --text:    #1e293b;
      --muted:   #64748b;
      --accent:  #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 2.5rem 3rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      background: #eff6ff;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid #bfdbfe;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128295;</div>
    <h1>Scheduled Maintenance</h1>
    <p>
      Parts Inventory is temporarily offline for a planned update.
      We'll be back in a few minutes — no data has been lost.
    </p>
    <span class="badge">Back shortly</span>
  </div>
</body>
</html>
