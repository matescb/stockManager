[project]
name = "stockmgr-backend"
version = "0.1.0"
description = "Parts Inventory & Production Manager — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    # Symmetric encryption for workspace-level secrets (provider API
    # keys, scanner license keys). See app/core/secrets.py + alembic 0016.
    "cryptography>=42.0",
    "itsdangerous>=2.2",
    "email-validator>=2.2",
    "chardet>=5.2",
    # Used by the Mouser + DigiKey provider clients at runtime.
    "httpx>=0.27",
    # Production error tracking. Inert when SENTRY_DSN is empty.
    "sentry-sdk[fastapi]>=2.18",
    # In-process rate limiter on the auth endpoints.
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Used by tests/test_ci_workflow.py (TEST-014 / issue #116) to parse
    # .github/workflows/ci.yml. Test-only — runtime app doesn't import yaml.
    "pyyaml>=6.0",
    # TEST-013 / issue #115. Adds `--cov` to the pytest invocation so CI
    # publishes a coverage report. We deliberately don't ship --cov-fail-under
    # yet (the issue says "ratchet later"); the floor is opened as a
    # follow-up once we have a measured baseline.
    "pytest-cov>=5.0",
    # Static analysis. Pinned <1.0 to avoid surprise rule churn — see
    # issue #121 / CQ-005. Configured via [tool.ruff] below.
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `slow` marker for tests that take meaningful wall time (e.g. the
# migration round-trip in tests/test_migrations.py). Default `pytest`
# excludes them; CI runs an explicit `pytest -m slow` step. See
# TEST-007 / issue #109.
markers = [
    "slow: long-running test (excluded by default; run with `-m slow`)",
    "real_db: test needs independent committed DB connections instead of savepoint isolation",
]
addopts = "-m 'not slow'"

# TEST-013 / issue #115. Coverage measurement config — published via CI
# artifacts (no Codecov yet). The runtime image (backend/Dockerfile)
# never installs the [dev] extra so this stays CI-only.
[tool.coverage.run]
source = ["app"]
branch = false
omit = [
    "*/__init__.py",
    # Belt-and-braces: alembic versions live under backend/alembic/versions/,
    # outside `source = ["app"]`, so they're already excluded. Keep the
    # explicit omit so accidental imports of migration modules don't
    # skew the report.
    "alembic/versions/*",
]

[tool.coverage.report]
show_missing = true
precision = 1
skip_empty = true

# Minimal ruff config — CQ-005 / issue #121. Intentionally narrow:
#   E  — pycodestyle errors
#   F  — pyflakes (unused imports, undefined names)
#   I  — isort (import ordering)
# No formatter, no auto-fix, no opinionated rule sets. CI runs
# `ruff check backend/app` (see .github/workflows/ci.yml). Bumping the
# rule list is a deliberate, separate PR — keep this list short.
[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic revision files have boilerplate `# revision identifiers, used
# by Alembic.` blocks that confuse the import-order rule.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
