services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockmgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockmgr}
      POSTGRES_DB: ${POSTGRES_DB:-stockmgr}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No host port published by default — the backend reaches the DB at db:5432
    # over the docker network. To inspect from the host with psql, uncomment:
    # ports:
    #   - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockmgr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stockmgr}:${POSTGRES_PASSWORD:-stockmgr}@db:5432/${POSTGRES_DB:-stockmgr}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required — copy .env.example to .env and set a value}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-24}
      UPLOAD_DIR: /data/uploads
      APP_ENV: ${APP_ENV:-dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build: ./web
    environment:
      VITE_API_BASE: http://localhost:8000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  db_data:
  uploads:
  web_node_modules:
