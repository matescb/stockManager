services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockmgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockmgr}
      POSTGRES_DB: ${POSTGRES_DB:-stockmgr}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No host port published by default — the backend reaches the DB at db:5432
    # over the docker network. To inspect from the host with psql, uncomment:
    # ports:
    #   - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockmgr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stockmgr}:${POSTGRES_PASSWORD:-stockmgr}@db:5432/${POSTGRES_DB:-stockmgr}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required — copy .env.example to .env and set a value}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-24}
      UPLOAD_DIR: /data/uploads
      APP_ENV: ${APP_ENV:-dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # The kicad-render sidecar draws the CAD tab's 2D previews (see render/).
      EDA_RENDER_URL: http://kicad-render:8080
      # Label printer. Empty (the default) = printing disabled; the print
      # service fails closed rather than silently pretending to print. Set
      # PRINT_HOST in .env to point dev at a real or stub printer. Dev has no
      # printing cron sidecar — run the jobs by hand:
      #   docker compose -f docker-compose.dev.yml exec backend \
      #       python -m app.cli.run_job print-dispatch
      PRINT_HOST: ${PRINT_HOST:-}
      PRINT_PORT: ${PRINT_PORT:-9100}
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build: ./web
    environment:
      VITE_API_BASE: http://localhost:8000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # KiCad render sidecar — draws the CAD tab's 2D symbol/footprint SVGs via
  # kicad-cli (see render/). Internal only; the backend reaches it at
  # kicad-render:8080. To eyeball a rendered SVG from the host, temporarily
  # add:  ports: ["18080:8080"]  and GET one of the sidecar's endpoints.
  kicad-render:
    build: ./render
    environment:
      RENDER_PORT: "8080"
    restart: unless-stopped

volumes:
  db_data:
  uploads:
  web_node_modules:
